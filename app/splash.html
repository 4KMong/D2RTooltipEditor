<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    body { display: grid; place-items: stretch; }
    #splashCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="splashCanvas" width="800" height="400" aria-label="프로그램 시작 로딩 화면"></canvas>
  <script type="module" src="./src/startupSplash.js"></script>
</body>
</html>
